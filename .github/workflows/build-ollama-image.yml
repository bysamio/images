name: Build BySamio Ollama CPU Image

on:
  push:
    branches: [main]
    paths: ['ollama/**', '.github/workflows/build-ollama-image.yml']
  pull_request:
    paths: ['ollama/**', '.github/workflows/build-ollama-image.yml']
  schedule:
    - cron: '51 4 * * 1'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Publish a new version from main after tests and scan pass'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ollama-${{ github.ref }}
  cancel-in-progress: false

env:
  LOCAL_IMAGE: ollama:ci
  RELEASE_IMAGE: ghcr.io/bysamio/ollama:0.40.3-cpu-r1-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the home-server platform once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./ollama
          target: runtime
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
      - name: Test real CPU generation/embeddings with outbound networking removed
        run: make -C ollama test IMAGE="$LOCAL_IMAGE"
      - name: Build the matching audit stage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./ollama
          target: build
          platforms: linux/amd64
          load: true
          push: false
          tags: ollama-build:ci
      - name: Audit Go dependencies and the exact runtime binary
        run: |
          set -euo pipefail
          mkdir -p go-audit
          binary_sha=$(docker run --rm --network none --entrypoint sha256sum "$LOCAL_IMAGE" /usr/bin/ollama)
          binary_sha=${binary_sha%% *}
          docker run --rm --mount "type=bind,src=$PWD/ollama/test/audit,dst=/audit,readonly" \
            --mount "type=bind,src=$PWD/go-audit,dst=/evidence" ollama-build:ci bash /audit/run.sh
          python3 ollama/test/audit/check.py go-audit "$binary_sha"
      - name: Capture full findings, including advisories without fixes
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          version: v0.71.1
          scanners: vuln
          format: json
          output: trivy-report.json
          ignore-unfixed: false
          trivyignores: ollama/security/no-ignores.txt
          exit-code: '0'
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          version: v0.71.1
          format: cyclonedx
          output: sbom.cdx.json
          trivyignores: ollama/security/no-ignores.txt
          exit-code: '0'
      - name: Block every HIGH or CRITICAL finding before registry login
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          version: v0.71.1
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: ollama/security/no-ignores.txt
          exit-code: '1'
      - name: Preserve scan evidence even when the gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ollama-linux-amd64-${{ github.run_id }}
          path: |
            trivy-report.json
            sbom.cdx.json
            go-audit/
          if-no-files-found: warn
          retention-days: 30
      - name: Export the exact tested image for the publication job
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_image))
        run: docker save "$LOCAL_IMAGE" | gzip > ollama-image.tar.gz
      - name: Transfer the tested image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_image))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ollama-tested-image-${{ github.run_id }}
          path: ollama-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_image))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ollama-tested-image-${{ github.run_id }}
      - name: Load the tested artifact
        run: gzip -dc ollama-image.tar.gz | docker load
      - name: Log in for publication
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image with a new version
        shell: bash
        run: |
          set -euo pipefail
          # Run ID + attempt makes every release tag unique, including reruns.
          # Weekly scans never publish; there is no floating/latest tag.
          docker tag "$LOCAL_IMAGE" "$RELEASE_IMAGE"
          docker push "$RELEASE_IMAGE"
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$RELEASE_IMAGE" > published-image.txt
          test -s published-image.txt
          printf 'Published tag: %s\n' "$RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          cat published-image.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve published digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ollama-published-reference-${{ github.run_id }}
          path: published-image.txt
          if-no-files-found: error
