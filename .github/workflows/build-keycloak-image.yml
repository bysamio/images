name: Build BySamio Keycloak Image

on:
  push:
    branches:
      - main
    paths:
      - 'keycloak/**'
      - '.github/workflows/build-keycloak-image.yml'
  pull_request:
    paths:
      - 'keycloak/**'
      - '.github/workflows/build-keycloak-image.yml'
  schedule:
    - cron: '22 4 * * 1'
  workflow_dispatch:
    inputs:
      keycloak_version:
        description: 'Keycloak version to build'
        required: false
        default: '26.6.3'
      push_image:
        description: 'Push image to registry'
        required: false
        default: true
        type: boolean
      build_debug:
        description: 'Also build debug variant'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bysamio/keycloak
  KEYCLOAK_VERSION: ${{ github.event.inputs.keycloak_version || '26.6.3' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.KEYCLOAK_VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr

      # Fail-closed gate: build the image locally (amd64) and scan it BEFORE the
      # multi-arch push below. If the gate fails, the push step never runs, so
      # the vulnerable image never receives its consumer-facing tags.
      - name: Build default for pre-push scan (amd64, load)
        if: github.event_name != 'pull_request' && github.event.inputs.push_image != 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak
          file: ./keycloak/Dockerfile
          target: default
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: keycloak:scan-default
          build-args: |
            KEYCLOAK_VERSION=${{ env.KEYCLOAK_VERSION }}
          cache-from: type=gha

      - name: Trivy gate — default (block publish on fixable CRITICAL/HIGH)
        if: github.event_name != 'pull_request' && github.event.inputs.push_image != 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: keycloak:scan-default
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'

      - name: Build and push Docker image (default)
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak
          file: ./keycloak/Dockerfile
          target: default
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KEYCLOAK_VERSION=${{ env.KEYCLOAK_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract optimized metadata
        id: meta-optimized
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.KEYCLOAK_VERSION }}-optimized
            type=raw,value=optimized,enable={{is_default_branch}}

      - name: Build optimized for pre-push scan (amd64, load)
        if: github.event_name != 'pull_request' && github.event.inputs.push_image != 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak
          file: ./keycloak/Dockerfile
          target: optimized
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: keycloak:scan-optimized
          build-args: |
            KEYCLOAK_VERSION=${{ env.KEYCLOAK_VERSION }}
          cache-from: type=gha

      - name: Trivy gate — optimized (block publish on fixable CRITICAL/HIGH)
        if: github.event_name != 'pull_request' && github.event.inputs.push_image != 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: keycloak:scan-optimized
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'

      - name: Build and push Docker image (optimized)
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak
          file: ./keycloak/Dockerfile
          target: optimized
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta-optimized.outputs.tags }}
          labels: ${{ steps.meta-optimized.outputs.labels }}
          build-args: |
            KEYCLOAK_VERSION=${{ env.KEYCLOAK_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract debug metadata
        if: github.event.inputs.build_debug != 'false'
        id: meta-debug
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.KEYCLOAK_VERSION }}-debug
            type=raw,value=debug,enable={{is_default_branch}}

      - name: Build debug for pre-push scan (amd64, load)
        if: github.event_name != 'pull_request' && github.event.inputs.push_image != 'false' && github.event.inputs.build_debug != 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak
          file: ./keycloak/Dockerfile
          target: debug
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: keycloak:scan-debug
          build-args: |
            KEYCLOAK_VERSION=${{ env.KEYCLOAK_VERSION }}
          cache-from: type=gha

      - name: Trivy gate — debug (block publish on fixable CRITICAL/HIGH)
        if: github.event_name != 'pull_request' && github.event.inputs.push_image != 'false' && github.event.inputs.build_debug != 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: keycloak:scan-debug
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'

      - name: Build and push Docker image (debug)
        if: github.event.inputs.build_debug != 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak
          file: ./keycloak/Dockerfile
          target: debug
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta-debug.outputs.tags }}
          labels: ${{ steps.meta-debug.outputs.labels }}
          build-args: |
            KEYCLOAK_VERSION=${{ env.KEYCLOAK_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.KEYCLOAK_VERSION }}
          artifact-name: sbom-keycloak.spdx.json

      # NOTE: the authoritative fail-closed gate runs PRE-PUSH (amd64) above —
      # each variant is built locally, scanned, and only pushed if it passes.
      # The post-push `scan` job below adds multi-arch coverage + SARIF upload.

  test:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak
          file: ./keycloak/Dockerfile
          target: default
          platforms: linux/amd64
          push: false
          load: true
          tags: keycloak:test
          build-args: |
            KEYCLOAK_VERSION=${{ env.KEYCLOAK_VERSION }}

      - name: Test image runs as non-root
        run: |
          echo "Verifying nonroot configuration..."
          
          USER_ID=$(docker inspect keycloak:test --format '{{.Config.User}}')
          if [ "$USER_ID" != "1001" ]; then
            echo "ERROR: Container configured for UID $USER_ID, expected 1001"
            exit 1
          fi
          echo "SUCCESS: Container configured for UID 1001"

      - name: Test health endpoints
        run: |
          echo "Starting Keycloak container..."
          docker run -d --name kc-test \
            -p 8080:8080 -p 9000:9000 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_DB=dev-mem \
            keycloak:test
          
          echo "Waiting for Keycloak to start (up to 90 seconds)..."
          for i in $(seq 1 18); do
            sleep 5
            if curl -sf http://localhost:9000/health/ready > /dev/null 2>&1; then
              echo "SUCCESS: Health endpoint responding after $((i * 5)) seconds"
              docker stop kc-test
              docker rm kc-test
              exit 0
            fi
            echo "  Still waiting... ($((i * 5))s)"
          done
          
          echo "FAIL: Health endpoint did not respond within 90 seconds"
          docker logs kc-test
          docker stop kc-test
          docker rm kc-test
          exit 1

      - name: Test security context compatibility
        run: |
          echo "Testing restricted security context..."
          
          # Run with restricted settings
          docker run --rm \
            --user 1001:1001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid \
            --entrypoint java \
            keycloak:test \
            -version
          
          echo "SUCCESS: Image works with restricted security context"

      - name: Run Trivy scan on PR (default variant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: keycloak:test
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'

      # The optimized (distroless/debian) variant ships a different package set
      # than the default (alpine) variant and is the production image, so build
      # and scan it on PRs too.
      - name: Build optimized variant (for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak
          file: ./keycloak/Dockerfile
          target: optimized
          platforms: linux/amd64
          push: false
          load: true
          tags: keycloak:test-optimized
          build-args: |
            KEYCLOAK_VERSION=${{ env.KEYCLOAK_VERSION }}

      - name: Run Trivy scan on PR (optimized variant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: keycloak:test-optimized
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'

  # Post-publish backstop: scans every PUBLISHED variant (default + optimized +
  # debug) as a real multi-arch manifest and uploads SARIF to the Security tab.
  # The blocking fail-closed gate already ran pre-push in `build`; this layer
  # adds arm64 coverage, full-severity reporting, and scheduled drift detection.
  scan:
    name: Trivy Scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.event.inputs.push_image != 'false'
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ''
            name: default
          - variant: '-optimized'
            name: optimized
          - variant: '-debug'
            name: debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Full report -> Security tab (all severities). Non-blocking. The debug
      # variant is skipped when it was not built (build_debug=false on a manual run).
      - name: Trivy report (SARIF)
        if: matrix.name != 'debug' || github.event.inputs.build_debug != 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.KEYCLOAK_VERSION }}${{ matrix.variant }}
          format: 'sarif'
          output: 'trivy-${{ matrix.name }}.sarif'
          trivyignores: '.trivyignore'

      - name: Upload SARIF to GitHub Security tab
        if: matrix.name != 'debug' || github.event.inputs.build_debug != 'false'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.name }}.sarif'
          category: 'trivy-${{ matrix.name }}'

      # Blocking gate: fail on fixable CRITICAL/HIGH (honouring .trivyignore).
      - name: Trivy gate (fail on fixable CRITICAL/HIGH)
        if: matrix.name != 'debug' || github.event.inputs.build_debug != 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.KEYCLOAK_VERSION }}${{ matrix.variant }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'
